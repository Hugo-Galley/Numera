# Garde-fous locaux : mêmes contrôles que la CI, mais avant le commit / le push.
# Installation : `make hooks` (pre-commit est un outil de poste, hors dépendances du projet).
# Les `rev` sont des SHA de commit (jamais de tag flottant), la version est en commentaire.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && uv run --frozen ruff check app tests scripts alembic'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: ruff-mcp
        name: ruff (serveur MCP)
        entry: bash -c 'cd mcp-server && uv run --with ruff ruff check .'
        language: system
        pass_filenames: false
        files: ^mcp-server/.*\.py$
      - id: code-size
        name: plafonds de taille
        entry: python3 scripts/check_code_size.py
        language: system
        pass_filenames: false
        files: ^(backend/app|frontend/src|mcp-server)/
      # Plus lents : au push seulement
      - id: mypy
        name: types Python (mypy)
        entry: bash -c 'uv run --frozen --project backend python scripts/check_types.py'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
        stages: [pre-push]
      - id: frontend-typecheck
        name: types TypeScript
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/src/
        stages: [pre-push]

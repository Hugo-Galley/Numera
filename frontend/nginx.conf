# Limite de débit des routes d'authentification (login, passkey) : par IP cliente réelle (cf. real_ip ci-dessous)
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
# Serveur MCP : débit large (flux d'outils) mais borné
limit_req_zone $binary_remote_addr zone=mcp_zone:10m rate=120r/m;

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # IP cliente réelle. Devant nginx se trouve un proxy / tunnel du réseau privé (nginx n'est publié que sur
    # 127.0.0.1) : on ne croit X-Forwarded-For que s'il vient de ce réseau, et on retient l'adresse la plus à
    # droite qui n'en fait pas partie, c'est-à-dire celle ajoutée par ce proxy, jamais celle qu'un client a
    # pu inscrire lui-même au début de l'en-tête (sinon le rate-limit du login se contourne en la changeant).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Les imports CSV dépassent facilement la limite par défaut de 1 Mo (sinon 413)
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://unpkg.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # index.html est toujours revalidé : sans en-tête de cache, le navigateur gardait l'ancien et
    # chargeait l'ancien bundle après un déploiement. (Un add_header dans un location annule ceux du
    # server : les en-têtes de sécurité sont répétés.)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://unpkg.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Fichiers produits par Vite : leur nom contient un hash, ils ne changent jamais
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://unpkg.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Authentification : débit limité (le préfixe le plus long l'emporte sur /api/)
    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8001/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr = IP réelle (real_ip) : on écrase l'en-tête reçu au lieu d'y ajouter
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serveur MCP (Claude Code) : authentifié par token MCP, validé par le backend
    location = /mcp {
        limit_req zone=mcp_zone burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://mcp-server:8100/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Réponses en flux (SSE) : pas de mise en tampon, appels d'outils parfois longs
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

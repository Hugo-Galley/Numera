# Met à jour les digests/SHA épinglés (jamais de tag flottant, cf. CLAUDE.md) et les dépendances.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    # Délai de carence : une version fraîchement publiée (et peut-être compromise) n'est proposée qu'après 7 jours
    cooldown: { default-days: 7 }
    commit-message: { prefix: "build(deps)" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    # Délai de carence : une version fraîchement publiée (et peut-être compromise) n'est proposée qu'après 7 jours
    cooldown: { default-days: 7 }
    ignore:
      # Images de base : on reste sur Python 3.12 (pydantic-core) et Node LTS ; montée de version décidée à la main.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    # Délai de carence : une version fraîchement publiée (et peut-être compromise) n'est proposée qu'après 7 jours
    cooldown: { default-days: 7 }
    ignore:
      # Images de base : on reste sur Python 3.12 (pydantic-core) et Node LTS ; montée de version décidée à la main.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: docker
    directory: /mcp-server
    schedule: { interval: weekly }
    # Délai de carence : une version fraîchement publiée (et peut-être compromise) n'est proposée qu'après 7 jours
    cooldown: { default-days: 7 }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    # Délai de carence : une version fraîchement publiée (et peut-être compromise) n'est proposée qu'après 7 jours
    cooldown: { default-days: 7 }
    ignore:
      # Majeures bloquées : Vitest 5 exige Vite >= 6 ; TypeScript 7 non supporté par knip / typescript-eslint.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Migrations majeures à faire à la main, en PR dédiée (les PR Dependabot échouent sinon au build/E2E) :
      # React 19 (+ types), Tailwind 4 (config et syntaxe), MSW 3.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # Vite et son plugin React montent ensemble (le plugin déclare le Vite majeur qu'il supporte) : une majeure
      # isolée casse `npm ci` (ERESOLVE). Vite 8 / plugin-react 6 en place ; la suite se migre à la main, en une PR.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: msw
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    # Délai de carence : une version fraîchement publiée (et peut-être compromise) n'est proposée qu'après 7 jours
    cooldown: { default-days: 7 }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: uv
    directory: /mcp-server
    schedule: { interval: weekly }
    # Délai de carence : une version fraîchement publiée (et peut-être compromise) n'est proposée qu'après 7 jours
    cooldown: { default-days: 7 }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(deps)" }

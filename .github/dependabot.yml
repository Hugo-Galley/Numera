# Met à jour les digests/SHA épinglés (jamais de tag flottant, cf. CLAUDE.md) et les dépendances.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      # Images de base : on reste sur Python 3.12 (pydantic-core) et Node LTS ; montée de version décidée à la main.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      # Images de base : on reste sur Python 3.12 (pydantic-core) et Node LTS ; montée de version décidée à la main.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: docker
    directory: /mcp-server
    schedule: { interval: weekly }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      # Majeures bloquées : Vitest 5 exige Vite >= 6 ; TypeScript 7 non supporté par knip / typescript-eslint.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "build(deps)" }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: uv
    directory: /mcp-server
    schedule: { interval: weekly }
    ignore:
      # mcp 2.x a renommé FastMCP en MCPServer : migrer le code avant d'accepter la majeure.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(deps)" }

# Met à jour les digests/SHA épinglés (jamais de tag flottant, cf. CLAUDE.md) et les dépendances.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: docker
    directory: /mcp-server
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: uv
    directory: /mcp-server
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }

name: Release

# Déclenchée par un tag vX.Y.Z posé sur main (ou sur une branche release/X.Y pour un correctif) (procédure et choix du bump : skill numera-release).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Vérifier le tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Le commit taggé est sur main ou sur une branche release/*
        run: |
          for ref in origin/main $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then echo "Présent sur $ref"; exit 0; fi
          done
          echo "::error::Le commit taggé n'est ni sur main ni sur une branche release/*"
          exit 1
      - name: Le CI est vert sur ce commit (attend sa fin s'il tourne encore)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le run du push sur main peut ne pas être listé tout de suite après le tag : on l'attend.
          run_id=""
          for _ in $(seq 1 12); do
            run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "Aucun run CI pour $GITHUB_SHA"; exit 1; }
          gh run watch "$run_id" --exit-status

  images:
    name: Image ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # signature cosign sans clé (OIDC GitHub)
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: numera-backend
            context: ./backend
            dockerfile: Dockerfile
          - image: numera-frontend
            context: ./frontend
            dockerfile: Dockerfile.prod
          - image: numera-mcp
            context: ./mcp-server
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags de l'image
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          {
            echo "list<<EOF"
            echo "$repo:$version"
            echo "$repo:${version%.*}"
            echo "$repo:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          load: true
          tags: scan/${{ matrix.image }}:release
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: "Trivy : pas de publication avec une CVE HIGH/CRITICAL corrigeable"
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scan/${{ matrix.image }}:release
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # SBOM (SPDX) et attestation de provenance SLSA attachés à l'image dans le registre
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signer l'image (cosign, sans clé) par son digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          cosign sign --yes "$repo@$DIGEST"

  release:
    name: Publier la release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Notes de version (depuis les commits)
        run: python3 scripts/release/release_notes.py --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Compose autonome (images de cette version)
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/NUMERA_VERSION:-latest/NUMERA_VERSION:-$version/" infra/docker-compose.images.yml > "$RUNNER_TEMP/docker-compose.yml"
          grep -q "NUMERA_VERSION:-$version}" "$RUNNER_TEMP/docker-compose.yml"
          # Somme de contrôle vérifiée par install.sh avant d'utiliser le compose téléchargé
          (cd "$RUNNER_TEMP" && sha256sum docker-compose.yml > SHA256SUMS)
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Numera ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "$RUNNER_TEMP/docker-compose.yml" \
            "$RUNNER_TEMP/SHA256SUMS"

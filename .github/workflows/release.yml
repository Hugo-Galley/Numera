name: Release

# Déclenchée par un tag vX.Y.Z posé sur main (procédure et choix du bump : skill numera-release).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Vérifier le tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Le commit taggé est sur main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Le CI est vert sur ce commit (attend sa fin s'il tourne encore)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le run du push sur main peut ne pas être listé tout de suite après le tag : on l'attend.
          run_id=""
          for _ in $(seq 1 12); do
            run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "Aucun run CI pour $GITHUB_SHA"; exit 1; }
          gh run watch "$run_id" --exit-status

  images:
    name: Image ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: numera-backend
            context: ./backend
            dockerfile: Dockerfile
          - image: numera-frontend
            context: ./frontend
            dockerfile: Dockerfile.prod
          - image: numera-mcp
            context: ./mcp-server
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags de l'image
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          {
            echo "list<<EOF"
            echo "$repo:$version"
            echo "$repo:${version%.*}"
            echo "$repo:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publier la release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Notes de version (depuis les commits)
        run: python3 scripts/release_notes.py --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Compose autonome (images de cette version)
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/NUMERA_VERSION:-latest/NUMERA_VERSION:-$version/" docker-compose.images.yml > "$RUNNER_TEMP/docker-compose.yml"
          grep -q "NUMERA_VERSION:-$version}" "$RUNNER_TEMP/docker-compose.yml"
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Numera ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "$RUNNER_TEMP/docker-compose.yml"

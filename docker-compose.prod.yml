services:
  backend:
    build:
      context: ./backend
    container_name: numera-backend-prod
    environment:
      - APP_ENV=prod
      - DATABASE_URL=sqlite:////app/data/suivi_budget.db
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8082}
    volumes:
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  backup:
    build:
      context: ./backend
    container_name: numera-backup-prod
    environment:
      - DB_PATH=/app/data/suivi_budget.db
      - BACKUP_DIR=/app/backups
      - BACKUP_KEY=${BACKUP_KEY}
      - APP_ENV=prod
      - BACKUP_INTERVAL_SECONDS=86400 # 24h
    volumes:
      - ./backend/data:/app/data
      - ./backups:/app/backups
    depends_on:
      backend:
        condition: service_healthy
    command: python scripts/backup_scheduler.py
    restart: always

  mcp-server:
    build:
      context: ./mcp-server
    container_name: numera-mcp-prod
    profiles: ["mcp"]
    environment:
      - MCP_MODE=api
      - MCP_API_URL=http://backend:8001
      - MCP_API_USERNAME=${ADMIN_USERNAME:-admin}
      - MCP_API_PASSWORD=${MCP_API_PASSWORD:-}
      - MCP_TRANSPORT=stdio
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: numera-frontend-prod
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - backend
    restart: always

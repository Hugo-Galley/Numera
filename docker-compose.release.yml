# Surcharge de docker-compose.prod.yml : utilise les images publiées (GHCR) au lieu de les construire.
#
#   NUMERA_VERSION=0.2.0 docker compose --env-file .env \
#     -f docker-compose.prod.yml -f docker-compose.release.yml up -d --no-build
#
# NUMERA_VERSION absent = dernière release. Épingler une version permet de revenir en arrière
# (les migrations Alembic ne sont pas réversibles automatiquement : restaurer aussi la sauvegarde,
# cf. docs/BACKUP_RESTORE.md).
services:
  backend:
    image: ghcr.io/hugo-galley/numera-backend:${NUMERA_VERSION:-latest}
  backup:
    image: ghcr.io/hugo-galley/numera-backend:${NUMERA_VERSION:-latest}
  mcp-server:
    image: ghcr.io/hugo-galley/numera-mcp:${NUMERA_VERSION:-latest}
  frontend:
    image: ghcr.io/hugo-galley/numera-frontend:${NUMERA_VERSION:-latest}
